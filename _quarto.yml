project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - llms.txt
    - LICENSE
    - LICENSES/
    - "**/*.md"
    - shapes/example-talk.html
    - shapes/example-talk.css
    - "**/*.dot"

website:
  title: "Presentations"
  description: "What any presentation shares, by what research has measured: rules for a talk to a room, each with its grade of evidence, and the contexts that override them."
  site-url: "https://tewf.github.io/reader-ergonomics-presentations/"
  repo-url: "https://github.com/Tewf/reader-ergonomics-presentations"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Standard
        href: standard.md
      - text: Principles
        href: principles/index.qmd
      - text: Contexts
        href: reader-styles/index.qmd
      - text: Shapes
        href: shapes/index.qmd
      - text: Evidence
        href: evidence/index.qmd
      - text: Bibliography
        href: evidence/bibliography.md
    right:
      - text: reader-ergonomics
        href: https://tewf.github.io/reader-ergonomics/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
