# Checks of reader-ergonomics-presentations: the standard's config, merged with what this extension changes.
# The deck checks live in local/; each threshold below is tunable and tagged PROVISIONAL until measured.
extends = "reader-ergonomics"

[standard_card]
facets = ["pace", "slide", "talk", "figure"]

[decks]
files = ["shapes/*.html", "*.deck.html"]   # HTML decks: one <section> per slide
exempt = []
aside_classes = ["title", "backup", "questions"]   # slides that are not content slides

[slide_words]
max_words = 40   # PROVISIONAL: no study gives a number; Adesope 2012 argues for key terms over a script

[deck_builds]
min_items = 4    # PROVISIONAL: a list this long is shown point by point

[slide_headlines]
min_words = 4    # PROVISIONAL: shorter than this is a topic label, not a sentence
max_words = 15   # PROVISIONAL: longer than this is a paragraph, not a headline

[slide_type_size]
min_px = 24      # PROVISIONAL: a convention; no study gives a minimum projected size
reference_height_px = 1080   # PROVISIONAL: vh sizes are read at this screen height, a 1080p projector

[talk_structure]
plan_within = 3  # the plan appears among the first slides
short_slot_minutes = 10   # PROVISIONAL: the casual context's short slot (3 to 10 minutes) needs no plan slide

[readable_measure]
stylesheets = []   # the standard's site.css is not in this repository; its site borrows it at build time

[figure_width]
max_columns = 60   # PROVISIONAL: the narrow end of the readable measure, so a figure fits where its text fits
exempt = ["evidence/bibliography.md"]

[sufficient_contrast]
stylesheets = ["shapes/example-talk.css"]
surfaces = ["section"]   # a slide is a section, a surface the text sits on

[figure_judgment]
exempt = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics", "reader-ergonomics-academic", "reader-ergonomics-learning",
          "reader-ergonomics-software-design", "reader-ergonomics-topic"]
shared_links = [
  "https://www.barbaraminto.com",   # one author's site for two works: the Minto 1987 book and the Minto 2026 training page
]
